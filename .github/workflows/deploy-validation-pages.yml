name: Deploy reviewed design-validation Pages

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full SHA of current main with successful CI
        required: true
        type: string

permissions: {}

concurrency:
  group: validation-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      asset_hashes: ${{ steps.identity.outputs.asset_hashes }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Verify requested main and successful CI
        uses: actions/github-script@v7
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        with:
          script: |
            const sha = process.env.EXPECTED_SHA;
            if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error('Full lowercase SHA required');
            if (context.ref !== 'refs/heads/main') throw new Error('Run only from main');
            const repo = context.repo;
            const {data: branch} = await github.rest.repos.getBranch({...repo, branch: 'main'});
            if (branch.commit.sha !== sha || context.sha !== sha) throw new Error('Main changed or unexpected workflow revision');
            const {data} = await github.rest.actions.listWorkflowRuns({...repo, workflow_id: 'ci.yml', head_sha: sha, branch: 'main', event: 'push', per_page: 100});
            if (!data.workflow_runs.some(run => run.head_sha === sha && run.status === 'completed' && run.conclusion === 'success')) throw new Error('Successful same-SHA main CI required');
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - name: Verify bounded distribution review inputs
        run: |
          # Review scope: AI-disabled design-validation app, not full product acceptance.
          # Source/lock/build input changes fail closed and require a fresh review.
          # No unreviewed Vite/npm configuration may be added at repository root.
          test -z "$(git ls-files -- '.env' '.env.*' '.npmrc')"
          test "$(git rev-parse HEAD:LICENSE)" = "d645695673349e3947e8e5ae42332d0ac3164cd7"
          test "$(git rev-parse HEAD:evals)" = "4fb6f1a1841ecdca70242a2a63da514dbc89862d"
          test "$(git rev-parse HEAD:index.html)" = "2d7cfb858c18a19ec7d44008a5ea572728248624"
          test "$(git rev-parse HEAD:package-lock.json)" = "31fcb25ba1574a63e5e082cbfeb4cec57d3fa578"
          test "$(git rev-parse HEAD:package.json)" = "a54b68b111eef15c97f933154c182f355ccf7cf6"
          test "$(git rev-parse HEAD:prompts)" = "7235e40a6c80b27e444f047761f0a3e3f3a764b3"
          test "$(git rev-parse HEAD:public)" = "945348035935b6a1af23cf2bfbb5a5ad37083c15"
          test "$(git rev-parse HEAD:scripts)" = "baa8056f715b03f3995b3575ec9dac071fea2fd4"
          test "$(git rev-parse HEAD:src)" = "452d08fbff4b9b2f55594cff9882e07348fc157b"
          test "$(git rev-parse HEAD:tsconfig.json)" = "49288949939d67e70dbecf04cb22b1afd62a8320"
          test "$(git rev-parse HEAD:vite.config.ts)" = "951309ee63ec4d1f1bc6a5705d7ff0ca81bae2c0"
          echo "ca3023f1cfafa271ad0727a1fe8c1ca7e7762320f3ed6b21241aeb387ef5dee6  public/THIRD_PARTY_NOTICES.txt" | sha256sum --check --strict
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build validation version
        env:
          VITE_APP_BASE: /rontenseiri/
        run: |
          git diff --exit-code
          npm run build
          test -s dist/THIRD_PARTY_NOTICES.txt
          ! grep -q DISTRIBUTION_REVIEW_PENDING dist/THIRD_PARTY_NOTICES.txt
      - name: Verify build identity and artifact allowlist
        id: identity
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const x=JSON.parse(fs.readFileSync("dist/__rontenseiri_build_identity","utf8")); if(x.sha!==process.env.EXPECTED_SHA || x.buildSha!==process.env.EXPECTED_SHA || x.mode!=="production" || x.dirty!==false) throw new Error("Build identity mismatch");'
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          const hashes = {};
          const roots = new Set(['index.html', 'service-worker.js', '__rontenseiri_build_identity', 'THIRD_PARTY_NOTICES.txt']);
          for (const name of roots) if (!fs.lstatSync(`dist/${name}`).isFile()) throw new Error(`Missing regular file: ${name}`);
          function walk(dir, prefix = '') {
            for (const name of fs.readdirSync(dir)) {
              const relative = prefix + name;
              const stat = fs.lstatSync(path.join(dir, name));
              if (stat.isSymbolicLink()) throw new Error(`Symlink forbidden: ${relative}`);
              if (stat.isDirectory() && relative === 'assets') walk(path.join(dir, name), 'assets/');
              else if (!stat.isFile() || !(roots.has(relative) || /^assets\/[^/]+\.(js|css)$/.test(relative))) throw new Error(`Unexpected artifact: ${relative}`);
              else hashes[relative] = crypto.createHash('sha256').update(fs.readFileSync(path.join(dir, name))).digest('hex');
            }
          }
          walk('dist');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `asset_hashes=${JSON.stringify(hashes)}\n`);
          NODE
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Recheck main before deployment
        uses: actions/github-script@v7
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        with:
          script: |
            const {data} = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
            if (data.commit.sha !== process.env.EXPECTED_SHA) throw new Error('Main changed; rebuild the new revision');
      - name: Deploy validation artifact
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify every public artifact byte and identity
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ASSET_HASHES: ${{ needs.build.outputs.asset_hashes }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PYVERIFY'
          import hashlib, json, os, time, urllib.request
          base = os.environ['PAGE_URL']
          assert base == 'https://chameleonjp-lab.github.io/rontenseiri/'
          expected = os.environ['EXPECTED_SHA']
          hashes = json.loads(os.environ['ASSET_HASHES'])
          assert hashes and '__rontenseiri_build_identity' in hashes
          # HTTP 200 can contain an old CDN revision; retry semantic mismatches too.
          for attempt in range(18):
              try:
                  for path, digest in hashes.items():
                      with urllib.request.urlopen(f'{base}{path}?sha={expected}&attempt={attempt}', timeout=30) as response:
                          data = response.read()
                      if hashlib.sha256(data).hexdigest() != digest:
                          raise ValueError(f'Public artifact mismatch: {path}')
                      if path == '__rontenseiri_build_identity':
                          identity = json.loads(data)
                          assert identity['sha'] == identity['buildSha'] == expected
                          assert identity['dirty'] is False and identity['mode'] == 'production'
                  print('All public artifact bytes match the fixed-SHA build.')
                  break
              except Exception as error:
                  if attempt == 17:
                      raise
                  print(f'Waiting for consistent public artifact: {error}')
                  time.sleep(10)
          PYVERIFY
